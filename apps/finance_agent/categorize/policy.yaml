# Rule-based categorization policy (F6 MVP-B).
# smart_importer / LLM personas can replace the analyst layer later.

threshold: 0.85
max_verifier_rounds: 2

rules:
  - id: fuel
    pattern: "(?i)\\b(shell|petro[- ]?can|esso|chevron|fuel|gas bar)\\b"
    category: "Expenses:Auto:Fuel"
    confidence: 0.92
  - id: groceries
    pattern: "(?i)\\b(costco|walmart|loblaws|sobeys|metro|superstore|grocery)\\b"
    category: "Expenses:Food:Groceries"
    confidence: 0.90
  - id: dining
    pattern: "(?i)\\b(restaurant|cafe|coffee|starbucks|tim hortons|mcdonald|uber eats|doordash)\\b"
    category: "Expenses:Food:Dining"
    confidence: 0.88
  - id: payroll
    pattern: "(?i)\\b(payroll|salary|direct dep|pay cheque)\\b"
    category: "Income:Salary:Employer"
    confidence: 0.93
  - id: interest
    pattern: "(?i)\\b(interest paid|interest earned|int pd|int earned)\\b"
    category: "Income:Interest:Bank"
    confidence: 0.91
  - id: transfer
    pattern: "(?i)\\b(transfer|e-?transfer|xfer|tfr)\\b"
    category: "Expenses:Transfers:Internal"
    confidence: 0.75

default_category: "Expenses:Misc"
default_confidence: 0.55
