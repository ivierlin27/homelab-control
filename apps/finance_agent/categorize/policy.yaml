# Rule-based categorization policy (F6 MVP-B).
# smart_importer / LLM personas can replace the analyst layer later.

threshold: 0.85
max_verifier_rounds: 2

rules:
  - id: fuel
    pattern: "(?i)(shell|petro[- ]?can|esso|chevron|\\bfuel\\b|gas bar)"
    category: "Expenses:Auto:Fuel"
    confidence: 0.92
  - id: groceries
    pattern: "(?i)(costco|walmart|loblaws|sobeys|metro|superstore|grocery)"
    category: "Expenses:Food:Groceries"
    confidence: 0.90
  - id: dining
    pattern: "(?i)(restaurant|cafe|coffee|starbucks|tim hortons|mcdonald|uber eats|doordash)"
    category: "Expenses:Food:Dining"
    confidence: 0.88
  - id: payroll
    pattern: "(?i)(payroll|salary|direct dep|pay cheque|blackbaud)"
    category: "Income:Salary:Employer"
    confidence: 0.93
  - id: interest
    pattern: "(?i)(interest paid|interest earned|int pd|int earned)"
    category: "Income:Interest:Bank"
    confidence: 0.91
  - id: utilities
    pattern: "(?i)(hydro|b\\.c\\. hydro|fortisbc|natgas|utilities)"
    category: "Expenses:Utilities:Electric"
    confidence: 0.88
  - id: transfer
    pattern: "(?i)(e-?transfer|interac|online transfer|scheduled transfer|xfer|\\btfr\\b)"
    category: "Expenses:Transfers:Internal"
    confidence: 0.75

default_category: "Expenses:Misc"
default_confidence: 0.55
