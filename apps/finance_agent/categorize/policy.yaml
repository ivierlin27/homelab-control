# Rule-based categorization policy (F6 MVP-B).
# Context rules use source account role + flow (in/out) + payee text.

threshold: 0.85
max_verifier_rounds: 2

account_roles:
  house_chequing:
    - ":Chequing:Joint-4969"
  house_savings:
    - ":Savings:Joint-"
  child_personal:
    - ":MaKaely-Personal-"
    - ":Ellowyn-Personal-"
  child_education:
    - ":MaKaely-Education-"
    - ":Ellowyn-Education-"
  parent_personal:
    - ":Kevin-4256"
    - ":Jennifer-4264"
    - ":Jennifer-Books-"
  credit_card:
    - ":CreditCard:"
  us_house:
    - ":BofA:"
    - ":Amplify:"

context_rules:
  # --- House savings/chequing: interest (before generic inflow xfer rules) ---
  - id: house_interest_inflow
    description_pattern: "(?:promotionalinterest|interestearned)"
    source_roles: [house_chequing, house_savings]
    flow: inflow
    category: "Income:Interest:Bank"
    confidence: 0.93
    reason: "bank interest or promotional interest credit"

  # --- Transfers: house accounts (any TF0764 / BMO xfer memo) ---
  - id: house_outflow_allowance
    description_pattern: "(?i)(e-?transfer|interac|online\\s*transfer|scheduled\\s*transfer|onlinetransfer|scheduledtransfer|xfer|tf0764#)"
    source_roles: [house_chequing, house_savings]
    flow: outflow
    category: "Expenses:Household:Allowance"
    confidence: 0.91
    reason: "house account outflow to family / internal xfer"

  - id: house_inflow_reimbursement
    description_pattern: "(?i)(e-?transfer|interac.*received|online\\s*transfer|onlinetransfer|scheduledtransfer|automatic\\s*pymt\\s*received|tf0764#)"
    source_roles: [house_chequing, house_savings]
    flow: inflow
    category: "Income:Household:FamilyReimbursement"
    confidence: 0.89
    reason: "house inflow — reimbursement or xfer in"

  # --- Transfers: person ↔ joint (969 / 4969 in memo) ---
  - id: person_to_house_payment
    description_pattern: "(?i)(e-?transfer|interac|online\\s*transfer|scheduled\\s*transfer|onlinetransfer|scheduledtransfer|tf0764#)"
    source_roles: [child_personal, child_education, parent_personal]
    flow: outflow
    counterparty_pattern: "(?i)(#3954-969|#3954-4969|joint-4969)"
    category: "Expenses:Household:CC-Reimbursement"
    confidence: 0.90
    reason: "personal outflow to joint house account"

  - id: house_to_person_allowance
    description_pattern: "(?i)(e-?transfer|interac|online\\s*transfer|scheduled\\s*transfer|onlinetransfer|scheduledtransfer|tf0764#)"
    source_roles: [child_personal, child_education, parent_personal]
    flow: inflow
    category: "Income:Household:Allowance"
    confidence: 0.90
    reason: "personal inflow — allowance from house"

  # --- Transfers: personal e-transfer out (no joint marker in memo) ---
  - id: personal_outflow_etransfer
    description_pattern: "(?i)(interac.*sent|e-?transfer.*sent)"
    source_roles: [child_personal, child_education, parent_personal]
    flow: outflow
    category: "Expenses:Transfers:External"
    confidence: 0.86
    reason: "personal e-transfer sent"

  - id: personal_inflow_etransfer
    description_pattern: "(?i)(interac.*received|e-?transfer.*received)"
    source_roles: [child_personal, child_education, parent_personal]
    flow: inflow
    category: "Income:Misc:TransferIn"
    confidence: 0.86
    reason: "personal e-transfer received"

  # --- House chequing: bill pay to credit cards ---
  - id: house_cc_billpay
    description_pattern: "(?i)(onlinebillpayment.*visa|onlinebillpayment.*mastercard|bill\\s*payment.*visa|royalbankvisa|bmo\\s*mastercard)"
    source_roles: [house_chequing, house_savings]
    flow: outflow
    category: "Expenses:Financial:CreditCardPayment"
    confidence: 0.90
    reason: "paying credit card from bank account"

  # --- Deposits / ATM ---
  - id: branch_deposit
    description_pattern: "(?i)^depositat,"
    source_roles: [child_personal, child_education, parent_personal, house_chequing]
    flow: inflow
    category: "Income:Misc:Deposit"
    confidence: 0.87

  - id: generic_deposit_personal
    description_pattern: "(?i)^deposit$"
    source_roles: [child_personal, child_education, parent_personal]
    flow: inflow
    category: "Income:Household:Allowance"
    confidence: 0.86

  - id: generic_deposit_house
    description_pattern: "(?i)^deposit$"
    source_roles: [house_chequing, house_savings]
    flow: inflow
    category: "Income:Misc:Deposit"
    confidence: 0.82

  - id: atm_withdrawal
    description_pattern: "(?i)(abmwithdrawal|atm\\s*withdrawal)"
    source_roles: []
    flow: outflow
    category: "Expenses:Cash:ATM"
    confidence: 0.88

  - id: incoming_wire
    description_pattern: "(?i)incomingwirepayment"
    source_roles: [house_chequing, house_savings, parent_personal]
    flow: inflow
    category: "Income:Wire:Incoming"
    confidence: 0.88

  - id: credit_card_payment_received
    description_pattern: "(?i)automatic\\s*pymt\\s*received"
    source_roles: [credit_card]
    flow: inflow
    category: "Expenses:Financial:CreditCardPayment"
    confidence: 0.91
    reason: "card payment posted (liability reduction)"

  - id: bmo_xfer_from_de_to_child
    description_pattern: "(?i)trsffrom/deacct/cpt\\s*0764.*969"
    source_roles: [child_personal, child_education, credit_card]
    flow: inflow
    category: "Income:Household:Allowance"
    confidence: 0.90
    reason: "BMO xfer from house DE acct (969)"

  - id: mobile_cheque_deposit
    description_pattern: "(?i)mobilechequedeposit"
    source_roles: [child_personal, child_education, parent_personal, house_chequing]
    flow: inflow
    category: "Income:Misc:Deposit"
    confidence: 0.86

  - id: preauth_bmo_card_payment
    description_pattern: "(?i)pre-authorizedpaymentnofee.*bmopayment"
    source_roles: [house_chequing, house_savings]
    flow: outflow
    category: "Expenses:Financial:CreditCardPayment"
    confidence: 0.89

  - id: online_bill_payment
    description_pattern: "(?i)onlinebillpayment"
    source_roles: [house_chequing, house_savings]
    flow: outflow
    category: "Expenses:Financial:CreditCardPayment"
    confidence: 0.88
    reason: "online bill pay from bank"

  # --- US BofA / Amplify (checking & savings) ---
  - id: us_withdrawal_allowance
    description_pattern: "(?:descriptive )?withdrawal allowance"
    source_roles: [us_house]
    flow: outflow
    category: "Expenses:Household:Allowance"
    confidence: 0.90
    reason: "US joint checking allowance transfer out"

  - id: us_deposit_raise
    description_pattern: "deposit 2019 raise"
    source_roles: [us_house]
    flow: inflow
    category: "Income:Salary:Employer"
    confidence: 0.88
    reason: "payroll / raise deposit"

  - id: us_withdrawal_raise
    description_pattern: "withdrawal 2019 raise"
    source_roles: [us_house]
    flow: outflow
    category: "Expenses:Transfers:Internal"
    confidence: 0.87

  - id: us_external_withdrawal
    description_pattern: "external withdrawal"
    source_roles: [us_house]
    flow: outflow
    category: "Expenses:Transfers:External"
    confidence: 0.86
