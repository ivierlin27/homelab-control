# ------------------------------------------------------------
# fava.dev-path.org
# Managed by homelab-control (F7). Upstream: Alienware Fava (read-only ledger).
# NPM host: LXC 102 (192.168.1.42). SSL cert: npm-5 (shared *.dev-path.org).
# Authentik forward-auth: see docs/runbooks/fava-authentik.md (Advanced tab).
# ------------------------------------------------------------

map $scheme $hsts_header {
    https   "max-age=63072000;includeSubDomains; preload";
}

server {
  set $forward_scheme http;
  set $server         "192.168.1.45";
  set $port           5002;

  listen 80;
  listen [::]:80;

  listen 443 ssl;
  listen [::]:443 ssl;

  server_name fava.dev-path.org;

  http2 on;

  include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
  include /etc/nginx/conf.d/include/ssl-cache.conf;
  include /etc/nginx/conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-5/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-5/privkey.pem;

  add_header Strict-Transport-Security $hsts_header always;

  include /etc/nginx/conf.d/include/force-ssl.conf;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_http_version 1.1;

  access_log /data/logs/proxy-host-18_access.log proxy;
  error_log /data/logs/proxy-host-18_error.log warn;

  location / {
    add_header Strict-Transport-Security $hsts_header always;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;

    include /etc/nginx/conf.d/include/proxy.conf;
  }

  include /data/nginx/custom/server_proxy[.]conf;
}
