[pytest]
# Use importlib mode so multiple test files can share basenames (e.g. several
# apps/<app>/test_main.py) without colliding through Python's module cache.
addopts = --import-mode=importlib -ra
pythonpath = .
testpaths = apps scripts
asyncio_mode = auto
markers =
    e2e: production-path integration tests (A2A worker + escalation stack)
    live: optional tests against deployed host/registry (HOMELAB_E2E_LIVE=1)
filterwarnings =
    ignore::DeprecationWarning:websockets.*
